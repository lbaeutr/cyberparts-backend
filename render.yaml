services:
  - type: web
    name: cyberparts-lbaeutr-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: 'alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://cyberparts-lbaeutr-web.onrender.com"]'
      - key: FRONTEND_URL
        value: https://cyberparts-lbaeutr-web.onrender.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_USERS
        value: "false"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://cyberparts-lbaeutr-api.onrender.com/api/auth/oauth/github/callback
      - key: GITHUB_OAUTH_SCOPES
        value: "read:user user:email"
